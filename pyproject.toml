[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "modjuke"
version = "1.0.0"
description = "Tracker music player built on libopenmpt and Tkinter"
requires-python = ">=3.9"
authors = [{ name = "flamingleo" }]
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
# Without an audio backend, playback uses silent output.
portaudio = ["sounddevice>=0.4"]
pulse = ["soundcard>=0.4"]
audio = ["sounddevice>=0.4", "soundcard>=0.4"]

[project.scripts]
modjuke = "modjuke.main:main"

[project.gui-scripts]
modjuke-gui = "modjuke.main:main"

[tool.setuptools]
packages = ["modjuke"]
